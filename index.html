<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rioluquitas">

    <title>Rioluquitas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: { light: '#F2F2F7', dark: '#000000' },
                        iosCard: { light: '#FFFFFF', dark: '#1C1C1E' },
                        themeGreen: {
                            light: '#A3B18A',
                            DEFAULT: '#3A5A40',
                            dark: '#344E41'
                        },
                        themeCafe: {
                            light: '#D4A373',
                            DEFAULT: '#582F0E',
                            dark: '#3E2723'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body { 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden;
            background-color: #F2F2F7;
        }
        .dark body { background-color: #000000; }

        .app-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header { 
            background: rgba(242, 242, 247, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            padding-top: var(--sat, 20px);
            height: calc(var(--sat, 20px) + 60px);
        }
        .dark .glass-header { 
            background: rgba(0, 0, 0, 0.75); 
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); 
        }
        
        .glass-nav { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            padding-bottom: var(--sab, 20px);
            height: calc(65px + var(--sab, 20px));
        }
        .dark .glass-nav { 
            background: rgba(28, 28, 30, 0.85); 
            border-top: 0.5px solid rgba(255, 255, 255, 0.1); 
        }
        
        .modal-sheet { 
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            padding-top: env(safe-area-inset-top, 0px);
        }
        .modal-active { transform: translateY(0) !important; }
        
        .ios-input-wrapper { position: relative; width: 100%; background-color: rgba(118, 118, 128, 0.12); border-radius: 16px; padding: 14px 18px; transition: all 0.2s; cursor: pointer; border: 1.5px solid transparent; }
        .dark .ios-input-wrapper { background-color: rgba(255, 255, 255, 0.08); }
        .ios-input-wrapper:active { transform: scale(0.98); background-color: rgba(118, 118, 128, 0.2); }

        .ios-input { width: 100%; background: transparent; font-size: 17px; border: none; outline: none; color: inherit; appearance: none; }
        
        /* --- ANIMACIÓN DE GIRO 3D --- */
        .perspective-container {
            perspective: 1000px;
            width: 100%;
            height: 220px;
            margin-bottom: 2rem;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flip-card.is-flipped {
            transform: rotateY(180deg);
        }

        .flip-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 40px;
            padding: 2rem;
            color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .flip-card-front {
            background-color: #3A5A40; /* themeGreen */
        }

        .flip-card-back {
            background-color: #582F0E; /* themeCafe */
            transform: rotateY(180deg);
        }

        .day-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 16px; font-weight: 600; transition: all 0.2s; }
        .day-btn:not(.empty):active { background-color: rgba(58, 90, 64, 0.2); transform: scale(0.9); }
        .day-btn.selected { background-color: #3A5A40 !important; color: white !important; font-weight: 800; }
        .day-btn.today { color: #3A5A40; border: 1px solid currentColor; }

        .modal-handle-container {
            width: 100%;
            padding: 12px 0 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            touch-action: none;
        }
        .modal-handle {
            width: 36px;
            height: 5px;
            background-color: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .dark .modal-handle { background-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="text-gray-900 dark:text-white antialiased">

    <div class="app-container w-full max-w-md mx-auto bg-iosBg-light dark:bg-iosBg-dark shadow-2xl relative">
        
        <!-- HEADER -->
        <header class="glass-header absolute top-0 left-0 right-0 z-20 px-5 flex justify-between items-end pb-3">
            <div class="flex items-center gap-3">
                <button onclick="openSettings()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-400/10 dark:bg-white/5 active:scale-90 transition-all">
                    <i class="ph ph-gear-six text-lg opacity-40"></i>
                </button>
                <h1 class="text-xl font-bold tracking-tight text-themeGreen-dark dark:text-themeGreen-light">Rioluquitas</h1>
            </div>
            <button onclick="openMonthPicker()" class="flex items-center gap-2 bg-gray-200/60 dark:bg-white/10 px-4 py-2 rounded-full active:scale-95 transition-transform">
                <i class="ph-fill ph-calendar-blank text-themeGreen"></i>
                <span id="header-month" class="text-[10px] font-bold uppercase tracking-widest opacity-80 uppercase">MAYO 2026</span>
                <i class="ph ph-caret-down text-[10px] text-gray-400"></i>
            </button>
        </header>

        <!-- CONTENIDO DINÁMICO -->
        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar px-5" style="padding-top: calc(var(--sat, 47px) + 85px); padding-bottom: 120px;">
        </main>

        <!-- NAVBAR -->
        <nav class="glass-nav absolute bottom-0 left-0 right-0 z-20 px-2 flex justify-between items-center">
            <button onclick="navigate('dashboard')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeGreen" data-id="dashboard">
                <i class="ph-fill ph-squares-four text-2xl"></i>
                <span class="text-[10px] font-medium mt-1">Inicio</span>
            </button>
            <button onclick="navigate('ingresos')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeGreen" data-id="ingresos">
                <i class="ph-fill ph-arrow-circle-down text-2xl"></i>
                <span class="text-[10px] font-medium mt-1">Ingresos</span>
            </button>
            <div class="relative w-[20%] h-full flex justify-center">
                <button onclick="openAddModal()" class="absolute -top-7 w-16 h-16 bg-themeGreen text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform border-[6px] border-iosBg-light dark:border-iosBg-dark">
                    <i class="ph ph-plus text-3xl font-bold"></i>
                </button>
            </div>
            <button onclick="navigate('gastos')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeCafe" data-id="gastos">
                <i class="ph-fill ph-arrow-circle-up text-2xl"></i>
                <span class="text-[10px] font-medium mt-1">Gastos</span>
            </button>
            <button onclick="navigate('prestamos')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeGreen-dark dark:data-[active=true]:text-themeGreen-light" data-id="prestamos">
                <i class="ph-fill ph-handshake text-2xl"></i>
                <span class="text-[10px] font-medium mt-1">Préstamos</span>
            </button>
        </nav>

        <!-- OVERLAY -->
        <div id="overlay" class="fixed inset-0 bg-black/40 z-30 opacity-0 pointer-events-none transition-opacity duration-400 backdrop-blur-md" onclick="closeModals()"></div>

        <!-- MODAL AGREGAR REGISTRO -->
        <div id="modal-add" class="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-iosCard-dark rounded-t-[40px] modal-sheet shadow-2xl h-[94vh] flex flex-col">
            <div class="modal-handle-container" onmousedown="startSwipe(event, 'modal-add')" ontouchstart="startSwipe(event, 'modal-add')">
                <div class="modal-handle"></div>
                <div class="w-full px-6 flex justify-between items-center mt-[-5px]">
                    <button type="button" onclick="closeModals()" class="text-gray-400 dark:text-gray-500 font-bold text-sm bg-gray-100 dark:bg-white/5 px-4 py-2 rounded-full">Cerrar</button>
                    <div class="w-16"></div>
                </div>
            </div>
            
            <form id="add-form" class="flex-1 flex flex-col gap-6 overflow-y-auto no-scrollbar px-6 pb-10">
                <h2 class="text-3xl font-black tracking-tight text-center">Nuevo Registro</h2>
                
                <div class="bg-gray-100 dark:bg-white/5 p-1.5 rounded-2xl flex">
                    <button type="button" onclick="setFormMode('ingreso')" id="btn-ingreso" class="flex-1 py-3 text-xs font-black rounded-xl transition-all">Ingreso</button>
                    <button type="button" onclick="setFormMode('gasto')" id="btn-gasto" class="flex-1 py-3 text-xs font-black rounded-xl transition-all">Gasto</button>
                    <button type="button" onclick="setFormMode('prestamo')" id="btn-prestamo" class="flex-1 py-3 text-xs font-black rounded-xl transition-all">Prestar</button>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase opacity-40 ml-1 tracking-widest">Monto</label>
                    <div class="ios-input-wrapper mt-1">
                        <input type="text" id="in-amount-formatted" required class="ios-input text-4xl font-black text-themeGreen dark:text-themeGreen-light" placeholder="$ 0" inputmode="numeric">
                        <input type="hidden" id="in-amount-raw">
                    </div>
                </div>

                <div onclick="openDatePicker('in-date')">
                    <label class="text-[10px] font-black uppercase opacity-40 ml-1 tracking-widest">Fecha</label>
                    <div class="ios-input-wrapper mt-1 flex items-center justify-between">
                        <span id="display-date" class="font-bold text-lg">Seleccionar...</span>
                        <i class="ph-fill ph-calendar text-2xl text-themeGreen"></i>
                        <input type="hidden" id="in-date">
                    </div>
                </div>

                <div id="cat-box">
                    <label class="text-[10px] font-black uppercase opacity-40 ml-1 tracking-widest">Categoría</label>
                    <div id="cat-grid" class="grid grid-cols-3 gap-3 mt-2"></div>
                </div>

                <div id="loan-box" class="hidden space-y-4">
                    <div>
                        <label class="text-[10px] font-black uppercase opacity-40 ml-1 tracking-widest">¿A quién?</label>
                        <div class="ios-input-wrapper mt-1">
                            <input type="text" id="in-person" class="ios-input font-bold" placeholder="Escribe un nombre">
                        </div>
                    </div>
                    <div onclick="openDatePicker('in-due')">
                        <label class="text-[10px] font-black uppercase opacity-40 ml-1 tracking-widest">Fecha de Cobro</label>
                        <div class="ios-input-wrapper mt-1 flex items-center justify-between">
                            <span id="display-due" class="font-bold">¿Cuándo cobras?</span>
                            <i class="ph-fill ph-hand-coins text-2xl text-themeCafe"></i>
                            <input type="hidden" id="in-due">
                        </div>
                    </div>
                </div>

                <button type="submit" class="mt-4 w-full bg-themeGreen text-white font-black py-5 rounded-[24px] shadow-xl active:scale-95 transition-transform mb-4 tracking-widest uppercase text-xs">Guardar Movimiento</button>
            </form>
        </div>

        <!-- SELECTOR DE FECHA -->
        <div id="modal-datepicker" class="fixed bottom-0 left-0 right-0 z-50 bg-white dark:bg-iosCard-dark rounded-t-[40px] modal-sheet shadow-2xl h-[94vh] flex flex-col">
            <div class="modal-handle-container" onmousedown="startSwipe(event, 'modal-datepicker')" ontouchstart="startSwipe(event, 'modal-datepicker')">
                <div class="modal-handle"></div>
                <div class="w-full px-6 flex justify-between items-center mt-[-5px]">
                    <button type="button" onclick="closeDatePickerModal()" class="text-gray-400 dark:text-gray-500 font-bold text-sm bg-gray-100 dark:bg-white/5 px-4 py-2 rounded-full">Atrás</button>
                    <div class="w-16"></div>
                </div>
            </div>

            <div class="flex-1 flex flex-col gap-8 overflow-y-auto no-scrollbar px-6">
                <h2 class="text-3xl font-black tracking-tight text-center">Seleccionar Fecha</h2>

                <div class="flex items-center justify-between px-2">
                    <button onclick="moveCalMonth(-1)" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-gray-100 dark:bg-white/5 active:scale-90 transition-all"><i class="ph-bold ph-caret-left text-xl"></i></button>
                    <div class="text-center">
                        <h3 id="cal-month-title" class="text-xl font-black tracking-tight">Mayo 2026</h3>
                    </div>
                    <button onclick="moveCalMonth(1)" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-gray-100 dark:bg-white/5 active:scale-90 transition-all"><i class="ph-bold ph-caret-right text-xl"></i></button>
                </div>

                <div class="bg-gray-50 dark:bg-white/5 p-4 rounded-[32px]">
                    <div class="grid grid-cols-7 text-center mb-4 text-[10px] font-black opacity-30">
                        <span>DOM</span><span>LUN</span><span>MAR</span><span>MIE</span><span>JUE</span><span>VIE</span><span>SAB</span>
                    </div>
                    <div id="datepicker-grid" class="grid grid-cols-7 gap-1">
                    </div>
                </div>

                <button onclick="confirmDate()" class="w-full py-5 bg-themeGreen text-white font-black text-xs uppercase tracking-widest rounded-3xl shadow-xl active:scale-95 transition-transform mb-6">Confirmar Selección</button>
            </div>
        </div>

        <!-- MODAL AJUSTES -->
        <div id="modal-settings" class="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-iosCard-dark rounded-t-[40px] modal-sheet shadow-2xl h-[94vh] flex flex-col">
            <div class="modal-handle-container" onmousedown="startSwipe(event, 'modal-settings')" ontouchstart="startSwipe(event, 'modal-settings')">
                <div class="modal-handle"></div>
                <div class="w-full px-6 flex justify-between items-center mt-[-5px]">
                    <button type="button" onclick="closeModals()" class="text-gray-400 dark:text-gray-500 font-bold text-sm bg-gray-100 dark:bg-white/5 px-4 py-2 rounded-full">Cerrar</button>
                    <div class="w-16"></div>
                </div>
            </div>

            <div class="flex-1 px-6">
                <h2 class="text-3xl font-black mb-8 text-center tracking-tight">Ajustes</h2>
                <div class="space-y-4">
                    <div class="bg-gray-100 dark:bg-white/5 p-5 rounded-3xl flex justify-between items-center">
                        <span class="font-bold text-sm tracking-tight">Modo Oscuro</span>
                        <button onclick="toggleDarkMode()" id="dark-btn" class="w-14 h-7 bg-gray-300 dark:bg-themeGreen rounded-full relative transition-all duration-300">
                            <div class="absolute top-1 left-1 dark:left-8 w-5 h-5 bg-white rounded-full transition-all shadow-md"></div>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="exportData()" class="bg-blue-500 text-white p-6 rounded-3xl flex flex-col items-center gap-2 font-black text-[10px] tracking-widest uppercase"><i class="ph-bold ph-download-simple text-2xl"></i>Exportar</button>
                        <label class="bg-amber-500 text-white p-6 rounded-3xl flex flex-col items-center gap-2 font-black text-[10px] tracking-widest uppercase cursor-pointer text-center">
                            <i class="ph-bold ph-upload-simple text-2xl"></i>Importar
                            <input type="file" id="import-input" class="hidden" accept=".json">
                        </label>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[60] bg-gray-800/95 dark:bg-white/95 text-white dark:text-black px-6 py-4 rounded-3xl text-xs font-black shadow-2xl opacity-0 transition-all duration-400 -translate-y-10 tracking-widest uppercase"></div>

    <script>
        let appData = JSON.parse(localStorage.getItem('finanzas_rioluquitas')) || {
            records: [],
            settings: { dark: false }
        };

        const save = () => localStorage.setItem('finanzas_rioluquitas', JSON.stringify(appData));

        let curDate = new Date();
        let curTab = 'dashboard';
        let curFormMode = 'gasto';
        let curSelCat = '';
        let viewGlobalBalance = false;
        
        let dpTargetId = '';
        let dpViewingDate = new Date();
        let dpSelectedDate = new Date();

        const mNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        
        const cats = {
            gasto: [
                { n: 'Comida', i: 'ph-hamburger', c: 'text-red-500' },
                { n: 'Super', i: 'ph-shopping-cart', c: 'text-blue-500' },
                { n: 'Transporte', i: 'ph-bus', c: 'text-orange-500' },
                { n: 'Salud', i: 'ph-first-aid', c: 'text-green-500' },
                { n: 'Ropa', i: 'ph-t-shirt', c: 'text-purple-500' },
                { n: 'Ocio', i: 'ph-ticket', c: 'text-pink-500' },
                { n: 'Hogar', i: 'ph-house', c: 'text-indigo-500' },
                { n: 'Personal', i: 'ph-flower-lotus', c: 'text-pink-400' },
                { n: 'Otros', i: 'ph-dots-three-circle', c: 'text-gray-400' }
            ],
            ingreso: [
                { n: 'Sueldo', i: 'ph-briefcase', c: 'text-green-600' },
                { n: 'Venta', i: 'ph-tag', c: 'text-blue-600' },
                { n: 'Regalo', i: 'ph-gift', c: 'text-pink-500' },
                { n: 'Otros', i: 'ph-plus-circle', c: 'text-gray-400' }
            ]
        };

        let startY = 0;
        let currentModalId = null;

        function startSwipe(e, id) {
            currentModalId = id;
            startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            document.addEventListener('mousemove', handleSwipe);
            document.addEventListener('touchmove', handleSwipe, { passive: false });
            document.addEventListener('mouseup', endSwipe);
            document.addEventListener('touchend', endSwipe);
        }

        function handleSwipe(e) {
            if (!currentModalId) return;
            const currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            const deltaY = currentY - startY;
            if (deltaY > 0) {
                const modal = document.getElementById(currentModalId);
                modal.style.transition = 'none';
                modal.style.transform = `translateY(${deltaY}px)`;
                if (e.cancelable) e.preventDefault();
            }
        }

        function endSwipe(e) {
            if (!currentModalId) return;
            const currentY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;
            const deltaY = currentY - startY;
            const modal = document.getElementById(currentModalId);
            modal.style.transition = ''; 
            if (deltaY > 150) {
                if (currentModalId === 'modal-datepicker') closeDatePickerModal();
                else closeModals();
            } else {
                modal.style.transform = 'translateY(0)';
            }
            currentModalId = null;
            document.removeEventListener('mousemove', handleSwipe);
            document.removeEventListener('touchmove', handleSwipe);
            document.removeEventListener('mouseup', endSwipe);
            document.removeEventListener('touchend', endSwipe);
        }

        const fmt = (n) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 }).format(n);

        function navigate(id) {
            curTab = id;
            document.querySelectorAll('.nav-tab').forEach(t => t.dataset.active = t.dataset.id === id);
            const main = document.getElementById('main-content');
            
            const listMonth = appData.records.filter(r => {
                const d = new Date(r.date + 'T00:00:00');
                return d.getMonth() === curDate.getMonth() && d.getFullYear() === curDate.getFullYear();
            });

            const statsMonth = getStats(listMonth);
            const statsGlobal = getStats(appData.records);

            if (id === 'dashboard') renderDashboard(main, statsMonth, statsGlobal, listMonth);
            else if (id === 'prestamos') renderLoans(main);
            else renderList(main, id, listMonth);

            updateHeader();
        }

        function getStats(data) {
            return data.reduce((acc, r) => {
                if(r.type === 'ingreso' || (r.type === 'prestamo' && r.status === 'paid')) acc.i += r.amount;
                else if(r.type === 'gasto' || (r.type === 'prestamo' && r.status === 'pending')) acc.g += r.amount;
                acc.b = acc.i - acc.g;
                return acc;
            }, { i: 0, g: 0, b: 0 });
        }

        // --- FUNCIÓN DE VOLTEO ---
        function toggleBalanceMode() {
            viewGlobalBalance = !viewGlobalBalance;
            const card = document.querySelector('.flip-card');
            if (card) {
                card.classList.toggle('is-flipped', viewGlobalBalance);
            }
        }

        function renderDashboard(el, sm, sg, data) {
            el.innerHTML = `
                <div class="perspective-container">
                    <div id="balance-card" class="flip-card ${viewGlobalBalance ? 'is-flipped' : ''}" onclick="toggleBalanceMode()">
                        
                        <!-- CARA FRONT (MENSUAL) -->
                        <div class="flip-card-face flip-card-front overflow-hidden">
                            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                            <div class="flex justify-between items-start mb-1">
                                <p class="text-[10px] font-black uppercase opacity-60 tracking-widest uppercase">Balance del Mes</p>
                                <i class="ph-fill ph-repeat text-white/30 text-xs"></i>
                            </div>
                            <h2 class="text-4xl font-black mb-6 tracking-tight">${fmt(sm.b)}</h2>
                            <div class="flex gap-4">
                                <div class="flex-1 bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/5">
                                    <p class="text-[9px] uppercase font-bold opacity-60 uppercase">Entradas</p>
                                    <p class="font-bold text-lg">${fmt(sm.i)}</p>
                                </div>
                                <div class="flex-1 bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/5">
                                    <p class="text-[9px] uppercase font-bold opacity-60 uppercase">Salidas</p>
                                    <p class="font-bold text-lg">${fmt(sm.g)}</p>
                                </div>
                            </div>
                        </div>

                        <!-- CARA BACK (GLOBAL) -->
                        <div class="flip-card-face flip-card-back overflow-hidden">
                            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                            <div class="flex justify-between items-start mb-1">
                                <p class="text-[10px] font-black uppercase opacity-60 tracking-widest uppercase">Balance Global</p>
                                <i class="ph-fill ph-repeat text-white/30 text-xs"></i>
                            </div>
                            <h2 class="text-4xl font-black mb-6 tracking-tight">${fmt(sg.b)}</h2>
                            <div class="flex gap-4">
                                <div class="flex-1 bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/5">
                                    <p class="text-[9px] uppercase font-bold opacity-60 uppercase">Total Histórico</p>
                                    <p class="font-bold text-lg">${fmt(sg.i)}</p>
                                </div>
                                <div class="flex-1 bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/5">
                                    <p class="text-[9px] uppercase font-bold opacity-60 uppercase">Gasto Total</p>
                                    <p class="font-bold text-lg">${fmt(sg.g)}</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <h3 class="text-[10px] font-black uppercase opacity-40 tracking-widest mb-5 ml-2 uppercase">Últimos Movimientos</h3>
                <div class="space-y-3 pb-8">
                    ${data.slice().reverse().slice(0,10).map(r => renderRow(r)).join('') || '<p class="text-center py-12 opacity-30 italic">Sin movimientos este mes</p>'}
                </div>
            `;
        }

        function renderRow(r) {
            const allCats = [...cats.gasto, ...cats.ingreso];
            const icon = r.type === 'prestamo' ? {i:'ph-fill ph-handshake', c:'text-amber-500'} : (allCats.find(c => c.n === r.category) || {i:'ph-fill ph-circle', c:'text-gray-400'});
            const isOut = r.type === 'gasto' || (r.type === 'prestamo' && r.status === 'pending');
            return `
                <div class="bg-iosCard-light dark:bg-iosCard-dark p-4 rounded-3xl flex justify-between items-center border border-black/5 dark:border-white/5 active:scale-95 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-gray-100 dark:bg-white/5 flex items-center justify-center ${icon.c}"><i class="${icon.i} text-2xl"></i></div>
                        <div>
                            <p class="text-sm font-black tracking-tight">${r.category}</p>
                            <p class="text-[9px] font-bold opacity-30 uppercase tracking-widest uppercase">${r.date}</p>
                        </div>
                    </div>
                    <p class="font-black text-base ${!isOut ? 'text-themeGreen' : 'text-gray-900 dark:text-white'}">${!isOut ? '+' : '-'} ${fmt(r.amount)}</p>
                </div>`;
        }

        function renderLoans(el) {
            const list = appData.records.filter(r => r.type === 'prestamo');
            el.innerHTML = `
                <h2 class="text-3xl font-black mb-8 tracking-tight px-2">Préstamos</h2>
                <div class="space-y-4">
                    ${list.reverse().map(r => `
                        <div class="bg-iosCard-light dark:bg-iosCard-dark p-6 rounded-[32px] border border-black/5 dark:border-white/5 ${r.status==='paid'?'opacity-40':''}">
                            <div class="flex justify-between items-center mb-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-full bg-amber-50 dark:bg-amber-500/10 text-amber-500 flex items-center justify-center"><i class="ph-bold ph-user text-xl"></i></div>
                                    <div>
                                        <p class="font-black text-lg">${r.category}</p>
                                        <p class="text-[9px] opacity-40 font-black uppercase tracking-widest uppercase">${r.date}</p>
                                    </div>
                                </div>
                                <p class="font-black text-xl">${fmt(r.amount)}</p>
                            </div>
                            ${r.status === 'pending' ? `<button onclick="payLoan(${r.id})" class="w-full py-4 bg-themeGreen text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">Me pagaron</button>` : '<div class="text-center text-[10px] font-black uppercase tracking-widest text-green-600 py-3 bg-green-50 dark:bg-green-500/10 rounded-2xl">Cobrado</div>'}
                        </div>`).join('') || '<p class="text-center py-24 opacity-30 italic">No tienes préstamos</p>'}
                </div>`;
        }

        function payLoan(id) {
            const idx = appData.records.findIndex(r => r.id === id);
            if(idx !== -1) {
                appData.records[idx].status = 'paid';
                save(); navigate('prestamos'); showToast('Préstamo cobrado');
            }
        }

        function renderList(el, tab, data) {
            const isIngreso = tab === 'ingresos';
            const filtered = data.filter(r => isIngreso ? r.type === 'ingreso' : (r.type === 'gasto' || (r.type === 'prestamo' && r.status === 'pending')));
            el.innerHTML = `
                <div class="bg-iosCard-light dark:bg-iosCard-dark p-10 rounded-[40px] text-center mb-8 border border-black/5 dark:border-white/5">
                    <p class="text-[10px] font-black opacity-40 uppercase tracking-widest mb-2 uppercase">${isIngreso ? 'Ingresos de ' + mNames[curDate.getMonth()] : 'Egresos de ' + mNames[curDate.getMonth()]}</p>
                    <h2 class="text-4xl font-black ${isIngreso ? 'text-themeGreen' : 'text-themeCafe'}">${fmt(filtered.reduce((s,r) => s + r.amount, 0))}</h2>
                </div>
                <div class="space-y-3 pb-10">${filtered.reverse().map(r => renderRow(r)).join('')}</div>`;
        }

        function openDatePicker(targetId) {
            dpTargetId = targetId; dpViewingDate = new Date(); renderDatePicker(); toggleModal('modal-datepicker', true);
        }

        function renderDatePicker() {
            const month = dpViewingDate.getMonth(); const year = dpViewingDate.getFullYear();
            document.getElementById('cal-month-title').textContent = `${mNames[month]} ${year}`;
            const grid = document.getElementById('datepicker-grid'); grid.innerHTML = '';
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="day-btn empty"></div>`;
            const today = new Date();
            for(let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;
                const isSelected = dpSelectedDate.getDate() === d && dpSelectedDate.getMonth() === month && dpSelectedDate.getFullYear() === year;
                const btn = document.createElement('button');
                btn.className = `day-btn ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
                btn.textContent = d;
                btn.onclick = () => { dpSelectedDate = new Date(year, month, d); renderDatePicker(); };
                grid.appendChild(btn);
            }
        }

        function moveCalMonth(delta) { dpViewingDate.setMonth(dpViewingDate.getMonth() + delta); renderDatePicker(); }

        function confirmDate() {
            const year = dpSelectedDate.getFullYear();
            const month = (dpSelectedDate.getMonth() + 1).toString().padStart(2, '0');
            const day = dpSelectedDate.getDate().toString().padStart(2, '0');
            const iso = `${year}-${month}-${day}`;
            const targetEl = document.getElementById(dpTargetId);
            if(targetEl) targetEl.value = iso;
            const label = `${day} de ${mNames[dpSelectedDate.getMonth()]}`;
            if(dpTargetId === 'in-date') document.getElementById('display-date').textContent = label;
            else if(dpTargetId === 'in-due') document.getElementById('display-due').textContent = label;
            closeDatePickerModal();
        }

        function closeDatePickerModal() {
            const m = document.getElementById('modal-datepicker'); m.classList.remove('modal-active'); m.style.transform = '';
            setTimeout(() => { if(!document.querySelector('.modal-active')) document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none'); }, 300);
        }

        function openAddModal() {
            setFormMode(curTab === 'ingresos' ? 'ingreso' : (curTab === 'prestamos' ? 'prestamo' : 'gasto'));
            dpSelectedDate = new Date(); dpTargetId = 'in-date'; confirmDate(); 
            if(curFormMode === 'prestamo') { dpTargetId = 'in-due'; confirmDate(); dpTargetId = 'in-date'; }
            document.getElementById('in-amount-formatted').value = ''; 
            document.getElementById('in-amount-raw').value = '';
            const p = document.getElementById('in-person'); if(p) p.value = '';
            toggleModal('modal-add', true);
        }

        function setFormMode(mode) {
            curFormMode = mode; curSelCat = '';
            ['ingreso', 'gasto', 'prestamo'].forEach(m => {
                const btn = document.getElementById('btn-'+m);
                if(btn) btn.className = m === mode ? "flex-1 py-3 text-xs font-black rounded-xl bg-white dark:bg-white/20 shadow-sm transition-all" : "flex-1 py-3 text-xs font-black rounded-xl opacity-40 transition-all";
            });
            const grid = document.getElementById('cat-grid');
            const catBox = document.getElementById('cat-box');
            const loanBox = document.getElementById('loan-box');
            if(grid) grid.innerHTML = '';
            if(mode === 'prestamo') { catBox.classList.add('hidden'); loanBox.classList.remove('hidden'); }
            else {
                catBox.classList.remove('hidden'); loanBox.classList.add('hidden');
                cats[mode].forEach(c => {
                    const b = document.createElement('button'); b.type = 'button';
                    b.className = "category-btn flex flex-col items-center gap-1.5 p-4 rounded-3xl bg-gray-100 dark:bg-white/5 transition-all active:scale-90 border-2 border-transparent";
                    b.onclick = () => { curSelCat = c.n; document.querySelectorAll('.category-btn').forEach(x => x.classList.remove('border-themeGreen')); b.classList.add('border-themeGreen'); };
                    b.innerHTML = `<i class="ph-fill ${c.i} text-2xl ${c.c}"></i><span class="text-[8px] font-black uppercase text-center uppercase">${c.n}</span>`;
                    grid.appendChild(b);
                });
            }
        }

        document.getElementById('add-form').onsubmit = (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('in-amount-raw').value);
            const date = document.getElementById('in-date').value;
            const category = curFormMode === 'prestamo' ? document.getElementById('in-person').value : curSelCat;
            if(!category || isNaN(amount)) return showToast('¡Faltan datos!');
            appData.records.push({ id: Date.now(), type: curFormMode, amount, date, category, status: curFormMode === 'prestamo' ? 'pending' : 'done' });
            save(); closeModals(); showToast('¡Guardado!'); navigate(curTab);
        };

        function closeModals() { 
            document.querySelectorAll('.modal-sheet').forEach(m => { m.classList.remove('modal-active'); m.style.transform = ''; });
            document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none'); 
        }

        function toggleModal(id, show) { 
            const o = document.getElementById('overlay'); const m = document.getElementById(id);
            if(show) { o.classList.remove('opacity-0', 'pointer-events-none'); m.style.transform = 'translateY(0)'; m.classList.add('modal-active'); }
            else closeModals(); 
        }

        function updateHeader() { 
            document.getElementById('header-month').textContent = `${mNames[curDate.getMonth()].toUpperCase()} ${curDate.getFullYear()}`; 
        }
        function toggleDarkMode() { appData.settings.dark = !appData.settings.dark; applyTheme(); save(); }
        function applyTheme() { if(appData.settings.dark) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }
        function showToast(m) { 
            const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('opacity-0', '-translate-y-10'); t.classList.add('opacity-100', 'translate-y-0'); 
            setTimeout(() => { t.classList.add('opacity-0', '-translate-y-10'); t.classList.remove('opacity-100', 'translate-y-0'); }, 2500); 
        }
        function openSettings() { toggleModal('modal-settings', true); }
        function exportData() { 
            const blob = new Blob([JSON.stringify(appData)], {type:'application/json'}); 
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup.json`; a.click(); 
        }

        document.getElementById('in-amount-formatted').addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, ''); 
            if (val === '') { document.getElementById('in-amount-raw').value = ''; e.target.value = ''; return; }
            document.getElementById('in-amount-raw').value = val;
            e.target.value = '$ ' + new Intl.NumberFormat('es-CL').format(val);
        });

        window.onload = () => { applyTheme(); navigate('dashboard'); };
    </script>
</body>
</html>
