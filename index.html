<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3A5A40">
    
    <!-- Preparación para GitHub y Home Screen (Iconos) -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <title>Rioluquitas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: { light: '#F2F2F7', dark: '#000000' },
                        iosCard: { light: '#FFFFFF', dark: '#1C1C1E' },
                        themeGreen: {
                            light: '#A3B18A',
                            DEFAULT: '#3A5A40',
                            dark: '#344E41'
                        },
                        themeCafe: {
                            light: '#D4A373',
                            DEFAULT: '#582F0E',
                            dark: '#3E2723'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        /* Prevenir zoom en iOS y comportamientos extraños */
        html {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body { 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden;
            background-color: #F2F2F7;
        }
        .dark body { background-color: #000000; }

        .app-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header { 
            background: rgba(242, 242, 247, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            padding-top: var(--sat, 20px);
            height: calc(var(--sat, 20px) + 54px);
        }
        .dark .glass-header { background: rgba(0, 0, 0, 0.75); border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); }
        
        .glass-nav { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            padding-bottom: var(--sab, 20px);
            height: calc(60px + var(--sab, 20px));
        }
        .dark .glass-nav { background: rgba(28, 28, 30, 0.85); border-top: 0.5px solid rgba(255, 255, 255, 0.1); }
        
        .modal-sheet { 
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            z-index: 50;
            display: flex;
            flex-direction: column;
            background-color: white;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            touch-action: none;
        }
        .dark .modal-sheet { background-color: #1C1C1E; }
        
        #modal-add { height: 92vh; }
        .modal-active { transform: translateY(0) !important; }
        
        .modal-handle-container {
            width: 100%;
            padding: 12px 0 12px 0;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }
        .modal-handle {
            width: 36px;
            height: 5px;
            background-color: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .dark .modal-handle { background-color: rgba(255,255,255,0.15); }

        .ios-input-full { 
            width: 100%; 
            background-color: rgba(118, 118, 128, 0.12); 
            border-radius: 14px; 
            padding: 14px 18px; 
            display: flex;
            align-items: center;
        }
        .dark .ios-input-full { background-color: rgba(255, 255, 255, 0.08); }

        /* ELIMINAR ZOOM: Font-size mínimo de 16px para inputs en iOS */
        .ios-input { 
            width: 100%; 
            background: transparent; 
            font-size: 16px; 
            border: none; 
            outline: none; 
            color: inherit; 
            font-weight: 700;
        }
        
        .day-btn { 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600;
            transition: all 0.2s;
        }
        .day-btn.selected { background-color: #3A5A40 !important; color: white !important; }

        .flip-card {
            position: relative;
            width: 100%;
            height: 180px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.is-flipped { transform: rotateY(180deg); }
        .flip-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 32px;
            padding: 1.5rem;
            color: white;
        }
        .flip-card-front { background-color: #3A5A40; }
        .flip-card-back { background-color: #582F0E; transform: rotateY(180deg); }
    </style>
</head>
<body class="text-gray-900 dark:text-white antialiased">

    <div class="app-container w-full max-w-md mx-auto bg-iosBg-light dark:bg-iosBg-dark shadow-2xl relative">
        
        <!-- HEADER -->
        <header class="glass-header absolute top-0 left-0 right-0 z-20 px-4 flex justify-between items-end pb-3">
            <div class="flex items-center gap-2">
                <button onclick="openSettings()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-400/10 dark:bg-white/5 active:scale-90 transition-all">
                    <i class="ph ph-gear-six text-lg opacity-40"></i>
                </button>
                <h1 class="text-lg font-bold tracking-tight text-themeGreen-dark dark:text-themeGreen-light">Rioluquitas</h1>
            </div>
            <button onclick="openGlobalMonthSelector()" class="flex items-center gap-2 bg-gray-200/60 dark:bg-white/10 px-3 py-1.5 rounded-full active:scale-95 transition-transform">
                <i class="ph-fill ph-calendar-blank text-themeGreen text-sm"></i>
                <span id="header-month" class="text-[10px] font-black uppercase tracking-widest leading-none">MAYO 2026</span>
                <i class="ph ph-caret-down text-[10px] text-gray-400"></i>
            </button>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar px-4" style="padding-top: calc(var(--sat, 47px) + 75px); padding-bottom: 100px;">
        </main>

        <!-- NAVBAR -->
        <nav class="glass-nav absolute bottom-0 left-0 right-0 z-20 px-2 flex justify-between items-center">
            <button onclick="navigate('dashboard')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeGreen" data-id="dashboard">
                <i class="ph-fill ph-squares-four text-xl"></i>
                <span class="text-[9px] font-bold mt-0.5">Inicio</span>
            </button>
            <button onclick="navigate('ingresos')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeGreen" data-id="ingresos">
                <i class="ph-fill ph-arrow-circle-down text-xl"></i>
                <span class="text-[9px] font-bold mt-0.5">Ingresos</span>
            </button>
            <div class="relative w-[20%] h-full flex justify-center">
                <button onclick="openAddModal()" class="absolute -top-6 w-14 h-14 bg-themeGreen text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform border-[4px] border-iosBg-light dark:border-iosBg-dark">
                    <i class="ph ph-plus text-2xl font-bold"></i>
                </button>
            </div>
            <button onclick="navigate('gastos')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeCafe" data-id="gastos">
                <i class="ph-fill ph-arrow-circle-up text-xl"></i>
                <span class="text-[9px] font-bold mt-0.5">Gastos</span>
            </button>
            <button onclick="navigate('prestamos')" class="nav-tab flex flex-col items-center justify-center w-[18%] text-gray-400 dark:text-gray-500 data-[active=true]:text-themeGreen" data-id="prestamos">
                <i class="ph-fill ph-handshake text-xl"></i>
                <span class="text-[9px] font-bold mt-0.5">Préstamos</span>
            </button>
        </nav>

        <!-- OVERLAY -->
        <div id="overlay" class="fixed inset-0 bg-black/40 z-[45] opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-[2px]" onclick="closeAllModals()"></div>

        <!-- MODAL AGREGAR / EDITAR REGISTRO -->
        <div id="modal-add" class="modal-sheet">
            <div class="modal-handle-container"><div class="modal-handle"></div></div>
            <form id="add-form" class="flex-1 overflow-y-auto no-scrollbar px-6 pb-10 flex flex-col gap-6">
                <div class="bg-gray-100 dark:bg-white/5 p-1 rounded-2xl flex">
                    <button type="button" onclick="setFormMode('ingreso')" id="btn-ingreso" class="flex-1 py-2.5 text-[10px] font-black rounded-xl transition-all">INGRESO</button>
                    <button type="button" onclick="setFormMode('gasto')" id="btn-gasto" class="flex-1 py-2.5 text-[10px] font-black rounded-xl transition-all">GASTO</button>
                    <button type="button" onclick="setFormMode('prestamo')" id="btn-prestamo" class="flex-1 py-2.5 text-[10px] font-black rounded-xl transition-all">PRESTAR</button>
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase opacity-40 ml-1 tracking-widest">Monto</label>
                    <div class="ios-input-full mt-1.5">
                        <input type="text" id="in-amount-formatted" required class="ios-input !text-2xl font-black text-themeGreen dark:text-themeGreen-light" placeholder="$ 0" inputmode="numeric">
                        <input type="hidden" id="in-amount-raw">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div onclick="openDatePicker('in-date')">
                        <label class="text-[9px] font-black uppercase opacity-40 ml-1 tracking-widest">Fecha Registro</label>
                        <div class="ios-input-full mt-1.5 cursor-pointer justify-between">
                            <span id="display-date" class="font-bold text-[14px]">Hoy</span>
                            <i class="ph ph-calendar text-lg text-themeGreen opacity-60"></i>
                            <input type="hidden" id="in-date">
                        </div>
                    </div>
                    
                    <div id="detalle-box">
                        <label class="text-[9px] font-black uppercase opacity-40 ml-1 tracking-widest text-blue-500">Detalle (Opcional)</label>
                        <div class="ios-input-full mt-1.5 border border-black/5 dark:border-white/5">
                            <input type="text" id="in-detail" class="ios-input !text-[16px] font-bold" placeholder="Ej: Pizza...">
                        </div>
                    </div>

                    <div id="paydate-box" class="hidden" onclick="openDatePicker('in-pay-date')">
                        <label class="text-[9px] font-black uppercase opacity-40 ml-1 tracking-widest text-amber-500">¿Cuándo pagan?</label>
                        <div class="ios-input-full mt-1.5 cursor-pointer justify-between border border-amber-500/20">
                            <span id="display-pay-date" class="font-bold text-[14px] text-amber-600">Elegir...</span>
                            <i class="ph ph-clock-afternoon text-lg text-amber-500 opacity-60"></i>
                            <input type="hidden" id="in-pay-date">
                        </div>
                    </div>
                </div>

                <div id="person-field" class="hidden">
                    <label class="text-[9px] font-black uppercase opacity-40 ml-1 tracking-widest">¿A quién?</label>
                    <div class="ios-input-full mt-1.5">
                        <input type="text" id="in-person" class="ios-input !text-[16px]" placeholder="Nombre">
                    </div>
                </div>

                <div id="cat-box">
                    <label class="text-[9px] font-black uppercase opacity-40 ml-1 tracking-widest">Categoría</label>
                    <div id="cat-grid" class="grid grid-cols-3 gap-2.5 mt-2"></div>
                </div>

                <button type="submit" id="btn-submit-form" class="mt-auto w-full bg-themeGreen text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-transform tracking-widest uppercase text-[10px]">Guardar Registro</button>
            </form>
        </div>

        <!-- MODAL DETALLES -->
        <div id="modal-details" class="modal-sheet">
            <div class="modal-handle-container"><div class="modal-handle"></div></div>
            <div class="px-8 pb-10 flex flex-col items-center text-center">
                <div id="detail-icon-container" class="w-20 h-20 rounded-full flex items-center justify-center mb-4 text-4xl">
                    <i id="detail-icon" class="ph-fill ph-circle"></i>
                </div>
                <p id="detail-category" class="text-sm font-black tracking-widest uppercase opacity-50 mb-1">Categoría</p>
                <h3 id="detail-amount" class="text-4xl font-black tracking-tight mb-6">$ 0</h3>
                
                <div class="w-full bg-gray-100 dark:bg-white/5 rounded-3xl p-5 mb-8 text-left space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-200 dark:border-white/10 pb-3">
                        <span class="text-[10px] font-black uppercase opacity-40 tracking-widest">Fecha</span>
                        <span id="detail-date" class="font-bold text-sm">...</span>
                    </div>
                    <div id="detail-text-container" class="flex flex-col gap-1.5 hidden">
                        <span class="text-[10px] font-black uppercase opacity-40 tracking-widest">Nota / Detalle</span>
                        <p id="detail-text" class="font-medium text-[13px] leading-relaxed">...</p>
                    </div>
                </div>
                
                <div class="flex gap-3 w-full">
                    <button id="btn-edit-detail" class="flex-1 py-4 bg-gray-900 dark:bg-white text-white dark:text-black font-black rounded-2xl text-[10px] uppercase tracking-widest active:scale-95 transition-all">Editar</button>
                    <button id="btn-delete-detail" class="flex-1 py-4 bg-red-500/10 text-red-500 font-black rounded-2xl text-[10px] uppercase tracking-widest active:scale-95 transition-all">Eliminar</button>
                </div>
            </div>
        </div>

        <!-- MODAL CALENDARIO -->
        <div id="modal-datepicker" class="modal-sheet">
            <div class="modal-handle-container"><div class="modal-handle"></div></div>
            <div class="px-6 pb-10 flex flex-col">
                <div class="flex items-center justify-between mb-6">
                    <button onclick="moveCalMonth(-1)" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-white/5 flex items-center justify-center active:scale-90"><i class="ph-bold ph-caret-left"></i></button>
                    <h3 id="cal-month-title" class="text-lg font-black tracking-tight">Mayo 2026</h3>
                    <button onclick="moveCalMonth(1)" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-white/5 flex items-center justify-center active:scale-90"><i class="ph-bold ph-caret-right"></i></button>
                </div>

                <div class="bg-gray-50 dark:bg-white/5 p-4 rounded-[28px] mb-6">
                    <div class="grid grid-cols-7 text-center mb-3 text-[10px] font-black opacity-30 tracking-widest">
                        <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
                    </div>
                    <div id="datepicker-grid" class="grid grid-cols-7 gap-1"></div>
                </div>

                <div class="flex flex-col gap-2">
                    <button onclick="setTodayDP()" class="w-full py-3.5 bg-themeGreen/10 text-themeGreen rounded-2xl font-black text-[10px] uppercase tracking-widest">Seleccionar Hoy</button>
                    <button onclick="closeModal('modal-datepicker')" class="w-full py-3.5 font-black text-[10px] uppercase tracking-widest opacity-40">Cerrar</button>
                </div>
            </div>
        </div>

        <!-- MODAL SELECCIÓN MES GLOBAL -->
        <div id="modal-month-selector" class="modal-sheet">
            <div class="modal-handle-container"><div class="modal-handle"></div></div>
            <div class="px-6 pb-10 flex flex-col">
                <div class="flex items-center justify-between mb-6 px-4">
                    <button onclick="changeYearGlobal(-1)" class="w-12 h-12 bg-gray-100 dark:bg-white/5 rounded-2xl flex items-center justify-center active:scale-90 transition-transform"><i class="ph-bold ph-caret-left text-lg"></i></button>
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-black opacity-30 uppercase tracking-[0.2em] mb-1">Año Seleccionado</span>
                        <span id="selector-year" class="text-3xl font-black tracking-tighter">2026</span>
                    </div>
                    <button onclick="changeYearGlobal(1)" class="w-12 h-12 bg-gray-100 dark:bg-white/5 rounded-2xl flex items-center justify-center active:scale-90 transition-transform"><i class="ph-bold ph-caret-right text-lg"></i></button>
                </div>
                
                <div class="grid grid-cols-3 gap-2.5 mb-6" id="month-grid-selector"></div>
                
                <button onclick="goToCurrentMonth()" class="w-full py-4 bg-themeGreen text-white rounded-2xl font-black text-[10px] uppercase tracking-[0.15em] shadow-xl shadow-themeGreen/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
                    <i class="ph-fill ph-calendar-star text-lg"></i>
                    Ir al Mes Actual (Hoy)
                </button>
            </div>
        </div>

        <!-- MODAL ALERTA PRÉSTAMO VENCIDO -->
        <div id="modal-alert" class="modal-sheet shadow-2xl border-2 border-amber-500/20">
            <div class="modal-handle-container"><div class="modal-handle"></div></div>
            <div class="px-8 pb-10 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mb-6">
                    <i class="ph-fill ph-warning-circle text-5xl"></i>
                </div>
                <h3 class="text-2xl font-black tracking-tight mb-2">¡Préstamo Vencido!</h3>
                <p id="alert-text" class="text-sm opacity-60 mb-8 font-medium">Tienes cobros pendientes que ya superaron su fecha de pago acordada.</p>
                <div id="alert-list" class="w-full space-y-3 mb-8 max-h-[300px] overflow-y-auto no-scrollbar"></div>
                <button onclick="closeModal('modal-alert')" class="w-full py-4 bg-gray-900 dark:bg-white text-white dark:text-black font-black rounded-2xl text-[10px] uppercase tracking-widest">Entendido</button>
            </div>
        </div>

        <!-- MODAL AJUSTES -->
        <div id="modal-settings" class="modal-sheet">
            <div class="modal-handle-container"><div class="modal-handle"></div></div>
            <div class="px-6 pb-10 flex flex-col">
                <h2 class="text-2xl font-black mb-8 text-center tracking-tight">Ajustes</h2>
                <div class="space-y-4">
                    <div class="bg-gray-100 dark:bg-white/5 p-5 rounded-2xl flex justify-between items-center">
                        <div class="flex flex-col">
                            <span class="font-bold text-sm tracking-tight">Modo Oscuro</span>
                            <span class="text-[9px] opacity-40 font-bold uppercase">Apariencia</span>
                        </div>
                        <button onclick="toggleDarkMode()" id="dark-btn" class="w-12 h-6 bg-gray-300 dark:bg-themeGreen rounded-full relative transition-all">
                            <div class="absolute top-1 left-1 dark:left-7 w-4 h-4 bg-white rounded-full transition-all shadow"></div>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="exportData()" class="bg-blue-500 text-white p-6 rounded-3xl flex flex-col items-center gap-2 font-black text-[9px] tracking-widest uppercase shadow-lg shadow-blue-500/20"><i class="ph-bold ph-download-simple text-2xl"></i>Exportar</button>
                        <label class="bg-amber-500 text-white p-6 rounded-3xl flex flex-col items-center gap-2 font-black text-[9px] tracking-widest uppercase cursor-pointer shadow-lg shadow-amber-500/20">
                            <i class="ph-bold ph-upload-simple text-2xl"></i>Importar
                            <input type="file" id="import-input" class="hidden" accept=".json">
                        </label>
                    </div>
                    <button onclick="clearAllData()" class="mt-2 w-full bg-red-500/10 text-red-500 p-4 rounded-3xl flex items-center justify-center gap-2 font-black text-[9px] tracking-widest uppercase shadow-sm active:scale-95 transition-all">
                        <i class="ph-bold ph-trash text-lg"></i>Limpiar Todo
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 z-[100] bg-gray-800/95 dark:bg-white/95 text-white dark:text-black px-6 py-3 rounded-full text-[9px] font-black shadow-2xl opacity-0 transition-all duration-400 -translate-y-10 tracking-widest uppercase pointer-events-none"></div>

    <script>
        let appData = JSON.parse(localStorage.getItem('finanzas_rioluquitas')) || {
            records: [],
            settings: { dark: false }
        };

        const save = () => localStorage.setItem('finanzas_rioluquitas', JSON.stringify(appData));
        
        let curDate = new Date();
        let curTab = 'dashboard';
        let curFormMode = 'gasto';
        let curSelCat = '';
        let viewGlobalBalance = false;
        let selectorYear = new Date().getFullYear();
        let editingId = null;

        const mNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        
        const cats = {
            gasto: [
                { n: 'Supermercado', i: 'ph-fill ph-shopping-cart', c: 'text-blue-500' },
                { n: 'Comida', i: 'ph-fill ph-hamburger', c: 'text-red-500' },
                { n: 'Transporte', i: 'ph-fill ph-bus', c: 'text-orange-500' },
                { n: 'Salud', i: 'ph-fill ph-first-aid', c: 'text-emerald-500' },
                { n: 'Hogar', i: 'ph-fill ph-house', c: 'text-indigo-500' },
                { n: 'Ocio', i: 'ph-fill ph-popcorn', c: 'text-slate-600' },
                { n: 'Personal', i: 'ph-fill ph-user', c: 'text-pink-400' },
                { n: 'Ropa', i: 'ph-fill ph-t-shirt', c: 'text-purple-500' },
                { n: 'Otros', i: 'ph-fill ph-dots-three-circle', c: 'text-gray-400' }
            ],
            ingreso: [
                { n: 'Sueldo', i: 'ph-fill ph-briefcase', c: 'text-green-600' },
                { n: 'Venta', i: 'ph-fill ph-tag', c: 'text-blue-600' },
                { n: 'Regalo', i: 'ph-fill ph-gift', c: 'text-pink-500' },
                { n: 'Otros', i: 'ph-fill ph-dots-three-circle', c: 'text-gray-400' }
            ]
        };

        let startY = 0;
        let isDragging = false;
        let currentDraggingModal = null;

        function initSwipeEvents() {
            const modales = document.querySelectorAll('.modal-sheet');
            modales.forEach(m => {
                m.addEventListener('touchstart', (e) => {
                    const scrollArea = e.target.closest('.overflow-y-auto');
                    if (scrollArea && scrollArea.scrollTop > 0) return;
                    startY = e.touches[0].clientY;
                    isDragging = true;
                    currentDraggingModal = m;
                    m.style.transition = 'none';
                }, { passive: true });

                m.addEventListener('touchmove', (e) => {
                    if (!isDragging || !currentDraggingModal) return;
                    const deltaY = e.touches[0].clientY - startY;
                    if (deltaY > 0) {
                        currentDraggingModal.style.transform = `translateY(${deltaY}px)`;
                        if (e.cancelable) e.preventDefault();
                    }
                }, { passive: false });

                m.addEventListener('touchend', (e) => {
                    if (!isDragging || !currentDraggingModal) return;
                    isDragging = false;
                    const deltaY = e.changedTouches[0].clientY - startY;
                    const modalId = currentDraggingModal.id;
                    currentDraggingModal.style.transition = 'transform 0.4s cubic-bezier(0.32, 0.72, 0, 1)';
                    if (deltaY > 120) closeModal(modalId);
                    else currentDraggingModal.style.transform = 'translateY(0)';
                    currentDraggingModal = null;
                }, { passive: true });
            });
        }

        function processOverdueLoans() {
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            let overdue = [];
            let movedCount = 0;

            appData.records.forEach(r => {
                if (r.type === 'prestamo' && r.status === 'pending') {
                    if (r.payDate && r.payDate < today) overdue.push(r);
                    const rDate = new Date(r.date + 'T00:00:00');
                    // Efecto Arrastre: Asegura que viaje mes a mes manteniendo originalDate
                    if (rDate.getFullYear() < currentYear || (rDate.getFullYear() === currentYear && rDate.getMonth() < currentMonth)) {
                        r.originalDate = r.originalDate || r.date; 
                        r.date = today;
                        movedCount++;
                    }
                }
            });
            if (movedCount > 0) save();
            if (overdue.length > 0) {
                const listEl = document.getElementById('alert-list');
                listEl.innerHTML = overdue.map(r => `
                    <div class="bg-amber-500/5 p-4 rounded-2xl flex justify-between items-center border border-amber-500/10">
                        <div class="text-left">
                            <p class="font-black text-sm">${r.category}</p>
                            <p class="text-[8px] font-bold text-amber-600 uppercase tracking-widest">Venció: ${r.payDate}</p>
                        </div>
                        <p class="font-black text-amber-600">${fmt(r.amount)}</p>
                    </div>
                `).join('');
                document.getElementById('modal-alert').classList.add('modal-active');
                document.getElementById('overlay').classList.remove('opacity-0', 'pointer-events-none');
            }
        }

            const main = document.getElementById('main-content');
            const listMonth = appData.records.filter(r => {
                const d = new Date(r.date + 'T00:00:00');
                return d.getMonth() === curDate.getMonth() && d.getFullYear() === curDate.getFullYear();
            });
            const statsMonth = getStats(listMonth);
            const statsGlobal = getStats(appData.records);

            if (id === 'dashboard') renderDashboard(main, statsMonth, statsGlobal, listMonth);
            else if (id === 'prestamos') renderLoans(main);
            else renderList(main, id, listMonth);
            
            updateHeader();
            attachPressEvents();
        }

        function getStats(data) {
            return data.reduce((acc, r) => {
                // Entradas = Ingresos + Prestamos cuando nos devuelven la plata
                if(r.type === 'ingreso' || (r.type === 'prestamo' && r.status === 'paid')) acc.i += r.amount;
                // Salidas = Gastos + Prestamos cuando nosotros pasamos la plata
                if(r.type === 'gasto' || r.type === 'prestamo') acc.g += r.amount;
                
                acc.b = acc.i - acc.g;
                return acc;
            }, { i: 0, g: 0, b: 0 });
        }

        function attachPressEvents() {
            const items = document.querySelectorAll('.record-item');
            items.forEach(item => {
                const id = parseInt(item.dataset.id);
                let timer;
                let isDrag = false;
                const start = () => { isDrag = false; timer = setTimeout(() => { isDrag = true; if('vibrate' in navigator) navigator.vibrate(50); editRecord(id); }, 500); };
                const move = () => { isDrag = true; clearTimeout(timer); };
                const end = (e) => { clearTimeout(timer); if (!isDrag && !e.target.closest('button.ignore-press')) openDetailsModal(id); };
                item.addEventListener('touchstart', start, {passive: true});
                item.addEventListener('touchmove', move, {passive: true});
                item.addEventListener('touchend', end);
                item.addEventListener('mousedown', start);
                item.addEventListener('mouseup', end);
            });
        }

        let dpTargetId = '';
        function openDatePicker(tid) { dpTargetId = tid; renderDP(); document.getElementById('modal-datepicker').classList.add('modal-active'); }
        function renderDP() {
            const grid = document.getElementById('datepicker-grid'); grid.innerHTML = '';
            const y = curDate.getFullYear(); const m = curDate.getMonth();
            document.getElementById('cal-month-title').textContent = `${mNames[m]} ${y}`;
            const first = new Date(y, m, 1).getDay(); const days = new Date(y, m+1, 0).getDate();
            const currentSelected = document.getElementById(dpTargetId).value;
            const selD = currentSelected ? parseInt(currentSelected.split('-')[2]) : 0;
            const selM = currentSelected ? parseInt(currentSelected.split('-')[1]) - 1 : -1;
            for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
            for(let d=1; d<=days; d++) {
                const isSelected = d === selD && m === selM;
                grid.innerHTML += `<button type="button" onclick="setDP(${d})" class="day-btn ${isSelected ? 'selected' : 'text-gray-900 dark:text-white'}">${d}</button>`;
            }
        }
        function setDP(d) {
            const iso = `${curDate.getFullYear()}-${(curDate.getMonth()+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
            document.getElementById(dpTargetId).value = iso;
            const label = dpTargetId === 'in-date' ? 'display-date' : 'display-pay-date';
            document.getElementById(label).textContent = `${d} ${mNames[curDate.getMonth()].substring(0,3)}`;
            closeModal('modal-datepicker');
        }
        function setTodayDP() { const now = new Date(); curDate = new Date(now.getFullYear(), now.getMonth(), 1); setDP(now.getDate()); }
        function moveCalMonth(d) { curDate.setMonth(curDate.getMonth() + d); renderDP(); }

        document.getElementById('add-form').onsubmit = (e) => {
            e.preventDefault();
            if(document.activeElement) document.activeElement.blur(); // Fix iOS Keyboard

            // Siempre parseInt sin decimales
            const amount = parseInt(document.getElementById('in-amount-raw').value, 10);
            const date = document.getElementById('in-date').value;
            const payDate = document.getElementById('in-pay-date').value;
            const detail = document.getElementById('in-detail').value;
            const category = curFormMode === 'prestamo' ? document.getElementById('in-person').value : curSelCat;
            
            if(!category || isNaN(amount)) return showToast('COMPLETAR DATOS');

            // Guardado dinámico de icono y color para evitar hardcode fallos
            const allCats = [...cats.gasto, ...cats.ingreso];
            const catObj = allCats.find(c => c.n === category);
            const icon = catObj ? catObj.i : 'ph-fill ph-circle';
            const color = catObj ? catObj.c : 'text-gray-400';

            if (editingId) {
                const idx = appData.records.findIndex(r => r.id === editingId);
                // originalDate siempre asegurado en edición o actualización
                if(idx !== -1) appData.records[idx] = { ...appData.records[idx], type: curFormMode, amount, date, payDate, detail, category, icon, color, originalDate: date };
                showToast('ACTUALIZADO');
            } else {
                appData.records.push({ id: Date.now(), type: curFormMode, amount, date, payDate, detail, category, status: curFormMode === 'prestamo' ? 'pending' : 'done', icon, color, originalDate: date });
                showToast('GUARDADO');
            }
            save(); closeAllModals(); navigate(curFormMode + 's');
        };

        function toggleDarkMode() { appData.settings.dark = !appData.settings.dark; applyTheme(); save(); }
        function applyTheme() { if(appData.settings.dark) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }
        function openSettings() { document.getElementById('modal-settings').classList.add('modal-active'); document.getElementById('overlay').classList.remove('opacity-0', 'pointer-events-none'); }
        function showToast(m) { 
            const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('opacity-0', '-translate-y-10'); t.classList.add('opacity-100', 'translate-y-0'); 
            setTimeout(() => { t.classList.add('opacity-0', '-translate-y-10'); t.classList.remove('opacity-100', 'translate-y-0'); }, 2000); 
        }
        function exportData() { 
            const blob = new Blob([JSON.stringify(appData)], {type:'application/json'}); 
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup.json`; a.click(); 
        }

        // Lógica de importación arreglada
        document.getElementById('import-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if(data.records) {
                        appData = data;
                        if (!appData.settings) appData.settings = { dark: false };
                        save();
                        applyTheme();
                        closeAllModals();
                        navigate('dashboard');
                        showToast('IMPORTADO CORRECTAMENTE');
                    }
                } catch(err) {
                    showToast('ERROR AL IMPORTAR');
                }
            };
            reader.readAsText(file);
        });

        // Limpiar todo (Nueva Función)
        function clearAllData() {
            if(confirm('¿Estás seguro de que quieres eliminar TODOS los registros? Esta acción no se puede deshacer.')) {
                appData.records = [];
                save();
                closeAllModals();
                navigate('dashboard');
                showToast('DATOS BORRADOS');
            }
        }

        document.getElementById('in-amount-formatted').addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, ''); 
            if (val === '') { document.getElementById('in-amount-raw').value = ''; e.target.value = ''; return; }
            document.getElementById('in-amount-raw').value = val;
            e.target.value = '$ ' + new Intl.NumberFormat('es-CL').format(val);
        });

        window.onload = () => { 
            applyTheme(); navigate('dashboard'); initSwipeEvents(); 
            setTimeout(processOverdueLoans, 800);
        };
    </script>
</body>
</html>
